<main>
  <h1>Despensa</h1>

  @if (error(); as message) {
    <p class="alert" role="alert">
      {{ message }}
      <button type="button" (click)="error.set(null)" aria-label="Cerrar">&times;</button>
    </p>
  }

  <section class="card">
    <h2>{{ selected() ? 'Editar producto' : 'Nuevo producto' }}</h2>
    <app-product-form [product]="selected()" (save)="onSave($event)" (cancelEdit)="clearSelection()" />
  </section>

  <section class="card">
    <h2>Productos ({{ products().length }})</h2>
    <app-product-list
      [products]="products()"
      [selectedId]="selected()?.id ?? null"
      (edit)="onEdit($event)"
      (remove)="onRemove($event)"
    />
  </section>
</main>
